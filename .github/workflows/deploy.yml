# Free hosting on GitHub Pages.
#
# One-time setup (repository on GitHub):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that every push to main/master publishes the site to
#   https://<your-user>.github.io/<repo-name>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # "Run workflow" button in the Actions tab

# Minimum permissions the Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tells us the final URL, so the site also works under /<repo-name>/.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}/
        run: bun run build

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Lint, type-check and unit tests. They do not block the deployment;
  # to make them blocking, remove `continue-on-error` and add `checks` to `needs`
  # of the `deploy` job below.
  checks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
